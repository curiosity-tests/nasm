name: NASM CI/CD

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

run-name: "NASM CI/CD ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    container:
      image: ubuntu:24.04

    steps:
      - name: Install curl/bash for action-checkout (racecar; ungated, both arms)
        shell: sh
        # Best-effort probe, never a gate. Inside a container job running as a
        # non-root user, apt-get cannot write /var/lib/apt/lists and exits 100,
        # which failed ardupilot's build job at step 3 before any of its own work
        # ran. GitHub uses `sh -e`, so a failing command aborts the script and a
        # trailing `exit 0` would never be reached -- hence `|| true` per branch
        # plus continue-on-error. If curl/bash are genuinely missing,
        # action-checkout fails next with a message that names the real problem.
        continue-on-error: true
        run: |
          command -v curl >/dev/null 2>&1 && command -v bash >/dev/null 2>&1 && exit 0
          SUDO=
          if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then SUDO=sudo; fi
          if command -v apt-get >/dev/null 2>&1; then
            { $SUDO apt-get update -qq && DEBIAN_FRONTEND=noninteractive $SUDO apt-get install -y -qq curl ca-certificates bash; } || true
          elif command -v apk >/dev/null 2>&1; then $SUDO apk add --no-cache curl ca-certificates bash || true
          elif command -v dnf >/dev/null 2>&1; then $SUDO dnf install -y curl ca-certificates bash || true
          elif command -v yum >/dev/null 2>&1; then $SUDO yum install -y curl ca-certificates bash || true
          elif command -v zypper >/dev/null 2>&1; then $SUDO zypper -n install curl ca-certificates bash || true
          fi
          exit 0

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y automake perl python3 build-essential

      - name: Checkout repository
        uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: Prepare build system
        run: |
          sh autogen.sh
          sh configure

      - name: Build
        run: |
          make
          ./nasm --version

      - name: Run travis tests
        run: |
          make travis

      - name: Upload travis.log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: travis-log
          path: travis.log
          if-no-files-found: warn

